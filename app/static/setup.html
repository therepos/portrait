<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait Setup Needed</title>
<style>
  :root { --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dddcd6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #222220; --text: #ececea; --muted: #a2a29c; --line: #3a3a37; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  .card { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--text); }
</style>
</head>
<body>
<div class="card">
  <h1>Setup needed</h1>
  <p>This app needs a sign-in before it can be used. Whoever runs it should set the environment
     variables <code>AUTH_USERNAME</code> and <code>AUTH_PASSWORD</code>, then restart it.</p>
  <p>To run it without a sign-in, for example only on a home network, set
     <code>ALLOW_NO_LOGIN=true</code> instead.</p>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portrait Card Maker</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #dddcd6; --accent: #1d1d1b; --accent-text: #ffffff; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #222220; --text: #ececea; --muted: #a2a29c;
      --line: #3a3a37; --accent: #ececea; --accent-text: #161615; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  @media (min-width: 760px) { main { grid-template-columns: 340px 1fr; align-items: start; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
           display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input[type=text] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                     border-radius: 8px; padding: 10px 12px; width: 100%; }
  input[type=file] { font: inherit; color: var(--text); }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text);
                 border-radius: 8px; padding: 10px 14px; cursor: pointer; text-decoration: none;
                 display: inline-flex; align-items: center; justify-content: center; }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled, .btn.disabled { opacity: .45; pointer-events: none; }
  .nudge { display: grid; grid-template-columns: repeat(3, 48px); gap: 6px; justify-content: start; }
  .nudge button { padding: 8px 0; }
  .preview { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
             display: grid; place-items: center; min-height: 320px; }
  .preview img { max-width: 100%; max-height: 80vh; display: block; border-radius: 4px;
                 box-shadow: 0 1px 8px rgba(0,0,0,.15); }
  @media (max-width: 759px) {
    /* keep the card in view while adjusting it */
    .preview { order: -1; position: sticky; top: 0; z-index: 1; min-height: 0; border-radius: 0 0 12px 12px; }
    .preview img { max-height: 42vh; }
    .placeholder { padding: 16px 12px; }
  }
  .placeholder { color: var(--muted); text-align: center; padding: 40px 12px; }
  #status { font-size: 14px; color: var(--muted); min-height: 1.4em; margin: 0; }
  #status.error { color: var(--error); }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<main>
  <section class="panel">
    <div>
      <h1>Portrait card</h1>
      <p class="muted">Pick a photo, type the caption, then download or save.</p>
    </div>
    <label>Photo
      <input id="photo" type="file" accept="image/*">
    </label>
    <label>Date
      <input id="date" type="text" placeholder="13 Nov" autocomplete="off">
    </label>
    <label>Name
      <input id="name" type="text" placeholder="Felicia 費子玹" autocomplete="off">
    </label>
    <label>Zoom <span id="zoomVal">100%</span>
      <input id="zoom" type="range" min="0.6" max="1.8" step="0.02" value="1">
    </label>
    <div>
      <p class="muted" style="margin-bottom:6px">Move photo</p>
      <div class="nudge">
        <span></span><button data-dy="-25" aria-label="Up">↑</button><span></span>
        <button data-dx="-25" aria-label="Left">←</button>
        <button id="reset" aria-label="Reset framing">⟲</button>
        <button data-dx="25" aria-label="Right">→</button>
        <span></span><button data-dy="25" aria-label="Down">↓</button><span></span>
      </div>
    </div>
    <div class="row">
      <a id="download" class="btn primary disabled" download="card.png">Download</a>
      <button id="save" hidden disabled>Save to folder</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <div id="placeholder" class="placeholder">Your card appears here.</div>
    <img id="card" alt="Card preview" hidden>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const state = { id: null, dx: 0, dy: 0, url: null };
let timer = null, seq = 0;

const d = new Date();
$("date").value = d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" });

function status(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}

function form() {
  const f = new FormData();
  f.append("id", state.id);
  f.append("date", $("date").value);
  f.append("name", $("name").value);
  f.append("zoom", $("zoom").value);
  f.append("dx", state.dx);
  f.append("dy", state.dy);
  return f;
}

async function errorText(res) {
  try { return (await res.json()).detail || res.statusText; } catch { return res.statusText; }
}

async function render() {
  if (!state.id) return;
  const mine = ++seq;
  status("Updating…");
  const res = await fetch("api/card", { method: "POST", body: form() });
  if (mine !== seq) return;  // a newer render is on its way
  if (!res.ok) {
    if (res.status === 404) state.id = null;
    return status(await errorText(res), true);
  }
  const blob = await res.blob();
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = URL.createObjectURL(blob);
  $("card").src = state.url;
  $("card").hidden = false;
  $("placeholder").hidden = true;
  const stem = ($("name").value.trim().split(/\s+/)[0] || "card").toLowerCase();
  $("download").href = state.url;
  $("download").download = stem + ".png";
  $("download").classList.remove("disabled");
  $("save").disabled = false;
  status("");
}

function later() { clearTimeout(timer); timer = setTimeout(render, 250); }

$("photo").addEventListener("change", async () => {
  const file = $("photo").files[0];
  if (!file) return;
  state.id = null; state.dx = 0; state.dy = 0; $("zoom").value = 1; $("zoomVal").textContent = "100%";
  $("download").classList.add("disabled"); $("save").disabled = true;
  status("Finding the face…");
  const f = new FormData(); f.append("photo", file);
  const res = await fetch("api/photo", { method: "POST", body: f });
  if (!res.ok) return status(await errorText(res), true);
  state.id = (await res.json()).id;
  render();
});

["date", "name"].forEach((id) => $(id).addEventListener("input", later));
$("zoom").addEventListener("input", () => {
  $("zoomVal").textContent = Math.round($("zoom").value * 100) + "%";
  later();
});
document.querySelectorAll(".nudge button[data-dx], .nudge button[data-dy]").forEach((b) =>
  b.addEventListener("click", () => {
    state.dx += Number(b.dataset.dx || 0);
    state.dy += Number(b.dataset.dy || 0);
    later();
  }));
$("reset").addEventListener("click", () => {
  state.dx = 0; state.dy = 0; $("zoom").value = 1; $("zoomVal").textContent = "100%"; later();
});

$("save").addEventListener("click", async () => {
  $("save").disabled = true;
  const res = await fetch("api/save", { method: "POST", body: form() });
  $("save").disabled = false;
  if (!res.ok) return status(await errorText(res), true);
  status("Saved as " + (await res.json()).saved);
});

fetch("api/config").then((r) => r.json()).then((c) => { $("save").hidden = !c.can_save; });
</script>
</body>
</html>

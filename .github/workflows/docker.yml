name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test
        run: |
          docker build -t portrait:test .
          docker run --rm -v "$PWD/tests:/srv/tests:ro" portrait:test sh -c "pip install -q pytest && python -m pytest -q -p no:cacheprovider tests"
          docker run -d --name smoke -p 8000:8000 portrait:test
          for i in $(seq 1 20); do curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8000/ | grep -q "Portrait card"
          docker rm -f smoke

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
